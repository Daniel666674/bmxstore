<body>
  <div id="site-header"></div>

  <!-- HERO: un solo momento fuerte, una foto/video, un solo CTA -->
  <section class="home-hero reveal">
    <video autoplay muted loop playsinline preload="auto" poster="assets/img/hero-poster.jpg">
      <source src="assets/video/stike-hero.mp4" type="video/mp4">
    </video>
    <div class="wrap home-hero-copy">
      <h1 data-reveal-words>Rueda duro,<br>vive BMX</h1>
      <p>La casa de todo el que rueda — repuestos, armado a tu medida y asesoría real de riders, en Venecia, Bogotá.</p>
      <a class="btn" href="tienda.html">Ver catálogo</a>
    </div>
  </section>

  <!-- GRILLA DE TILES: el golpe visual principal, con foto de stock real de hoy -->
  <section class="section">
    <div class="wrap">
      <div class="tile-grid stagger" id="home-tiles"></div>
    </div>
  </section>

  <!-- DESTACADOS -->
  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="section-head">
        <div>
          <span class="kicker" data-content-key="home.featuredKicker">Lo más vendido</span>
          <h2>Destacados <span class="spray">de la semana</span></h2>
        </div>
        <a class="link-more" href="tienda.html">Ver catálogo →</a>
      </div>
      <div class="product-grid stagger" id="home-featured"></div>
    </div>
  </section>

  <!-- FRANJA DE CONFIANZA: una línea, no cajas con ícono -->
  <div class="trust-strip">
    <b>Envíos a toda Colombia</b><span class="sep">·</span>
    <b>Armado gratis</b><span class="sep">·</span>
    <b>Paga fácil, cuotas sin interés</b><span class="sep">·</span>
    <b>Asesoría real de riders</b>
  </div>

  <div id="site-footer"></div>

  <script src="assets/js/products-data.js?v=3"></script>
  <script src="assets/js/data.js?v=3"></script>
  <script src="assets/js/app.js?v=8"></script>
  <script>
    stikeInit("home");

    // Grilla de tiles: subcategorias de Repuestos que hoy tienen stock (las
    // mismas que ya lista el mega-menu de "Repuestos" en el nav) + Fate.
    // Foto real de un producto vigente por tile -- nunca la de un producto
    // ya eliminado del catalogo ni un bodegon generico.
    const homeTiles = [
      { label: "Marcos", href: stikeSubUrl("repuestos", "Marcos"), img: "assets/img/products/marco-fiend-reynolds-negro-1.jpg" },
      { label: "Timones", href: stikeSubUrl("repuestos", "Timones"), img: "assets/img/products/timon-fiend-team-negro-1.jpg" },
      { label: "Cañas", href: stikeSubUrl("repuestos", "Espigas"), img: "assets/img/products/cana-bsd-front-load-negra-1.jpg" },
      { label: "Bielas", href: stikeSubUrl("repuestos", "Bielas"), img: "assets/img/products/bielas-primo-churchill-160mm-cromadas-1.jpg" },
      { label: "Platos", href: stikeSubUrl("repuestos", "Platos"), img: "assets/img/products/plato-fiend-omicron-cromado-25t-1.jpg" },
      { label: "Fate", href: "fate/", img: "assets/img/products/marco-fate-namaste-v2-2.jpg" },
    ];
    document.getElementById("home-tiles").innerHTML = homeTiles.map(t => `
      <a class="tile" href="${t.href}">
        <img src="${t.img}" alt="${t.label}" loading="lazy">
        <span class="tile-label">${t.label}</span>
      </a>`).join("");

    // Destacados: primeros productos variados del catalogo real de hoy.
    // 6 = dos filas limpias de 3 en la grilla de 3 columnas.
    const featured = STIKE_PRODUCTS.slice(0, 6);
    document.getElementById("home-featured").innerHTML = featured.map(stikeProductCard).join("");
  </script>
  <script src="assets/js/animations.js?v=5"></script>
</body>
