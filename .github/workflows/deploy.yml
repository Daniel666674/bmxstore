name: Deploy to GitHub Pages

# This is a demo with no real hosting account behind it: GitHub Pages is
# the actual (and only) deploy target. Runs on every push to main, and can
# be triggered manually from the Actions tab.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Rapid admin edits (each "Publicar cambios" in admin.html is its own commit)
# collapse into a single deploy of the final state instead of one deploy per
# commit.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
