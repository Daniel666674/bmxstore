<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<base href="/bmxstore/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda: Stike Bike Shop</title>
  <meta name="description" content="Catálogo Stike Bike Shop: repuestos, protecciones, ropa y accesorios BMX en Bogotá.">
  <link rel="canonical" href="https://daniel666674.github.io/bmxstore/tienda.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stike Bike Shop">
  <meta property="og:locale" content="es_CO">
  <meta property="og:title" content="Tienda BMX: Repuestos, protección y ropa | Stike Bike Shop">
  <meta property="og:description" content="Catálogo BMX en Bogotá: repuestos, protecciones, ropa y accesorios.">
  <meta property="og:url" content="https://daniel666674.github.io/bmxstore/tienda.html">
  <meta property="og:image" content="https://daniel666674.github.io/bmxstore/assets/img/og-stike.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://daniel666674.github.io/bmxstore/assets/img/og-stike.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=34">
  <link rel="icon" href="assets/img/favicon.png">
</head>
<body>
  <div id="site-header"></div>

  <div class="wrap page-head shop-head">
    <nav class="breadcrumb" id="crumb"></nav>
    <h1 id="page-title">Tienda</h1>
    <p class="page-sub" id="page-subtitle" hidden></p>
  </div>

  <div class="wrap shop-wrap" id="catalog"></div>

  <div id="site-footer"></div>

  <script src="assets/js/products-data.js?v=3"></script>
  <script src="assets/js/data.js?v=3"></script>
  <script src="assets/js/app.js?v=10"></script>
  <script src="assets/js/catalog.js?v=1"></script>
  <script>
    const initialCat = new URLSearchParams(location.search).get("cat") || "";
    stikeInit(initialCat);

    const titleEl = document.getElementById("page-title");
    const subtitleEl = document.getElementById("page-subtitle");
    const crumbEl = document.getElementById("crumb");
    const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let siteContentManifest = {}, lastState = null;
    const has = k => Object.prototype.hasOwnProperty.call(siteContentManifest, k);

    /* Titulo, miga de pan y subtitulo segun lo que el cliente esta mirando. */
    function buildHeader(S) {
      lastState = S;
      const sep = `<span class="sep">/</span>`;
      const home = `<a href="index.html">Inicio</a>`;
      const cat = S.cat ? stikeCategory(S.cat) : null;
      let title = "Tienda", subtitle = "", crumb = `${home}${sep}<span>Tienda</span>`;
      if (S.qRaw) {
        title = `Resultados para “${S.qRaw}”`;
        crumb = `${home}${sep}<a href="tienda.html">Tienda</a>${sep}<span>Búsqueda</span>`;
      } else if (cat) {
        title = cat.name;
        crumb = `${home}${sep}<a href="tienda.html">Tienda</a>${sep}<span>${escHtml(cat.name)}</span>`;
        if (S.subs.length === 1) {
          title = S.subs[0];
          crumb = `${home}${sep}<a href="tienda.html">Tienda</a>${sep}<a href="tienda.html?cat=${cat.slug}">${escHtml(cat.name)}</a>${sep}<span>${escHtml(S.subs[0])}</span>`;
        } else {
          // Banner de categoria editable desde el panel (por presencia de clave).
          if (has(`cat.${cat.slug}.title`)) title = siteContentManifest[`cat.${cat.slug}.title`];
          if (has(`cat.${cat.slug}.subtitle`)) subtitle = siteContentManifest[`cat.${cat.slug}.subtitle`];
          else subtitle = cat.blurb || "";
        }
      } else if (S.brands.length === 1) {
        title = S.brands[0];
        crumb = `${home}${sep}<a href="marcas.html">Marcas</a>${sep}<span>${escHtml(S.brands[0])}</span>`;
      } else if (S.sale && S.fromPromo) {
        title = "Promo";
        subtitle = "Precios especiales por tiempo limitado.";
        crumb = `${home}${sep}<a href="tienda.html">Tienda</a>${sep}<span>Promo</span>`;
      } else {
        subtitle = "Repuestos, ropa y protecciones BMX de las mejores marcas, con envíos a toda Colombia.";
      }
      titleEl.textContent = title;
      crumbEl.innerHTML = crumb;
      subtitleEl.textContent = subtitle;
      subtitleEl.hidden = !subtitle;
      syncCanonical(S);
    }

    // Cuando el filtro coincide con una landing de tipo de parte, esa landing es la
    // version canonica: si no, la URL con query string compite contra ella en Google.
    function syncCanonical(S) {
      const base = "https://daniel666674.github.io/bmxstore/";
      let target = base + "tienda.html";
      if (S.cat && S.subs.length === 1) {
        const url = stikeSubUrl(S.cat, S.subs[0]);
        if (url.indexOf("categoria/") === 0) target = base + url;
      }
      const link = document.querySelector('link[rel=canonical]');
      if (link) link.setAttribute("href", target);
      const og = document.querySelector('meta[property="og:url"]');
      if (og) og.setAttribute("content", target);
    }

    stikeCatalog({ mount: "#catalog", onChange: buildHeader });
    fetch("data/site-content.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : {}).catch(() => ({}))
      .then(c => { siteContentManifest = c || {}; if (lastState) buildHeader(lastState); });
  </script>
  <script src="assets/js/animations.js?v=6"></script>
</body>
</html>
